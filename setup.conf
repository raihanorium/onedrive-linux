# onedrive-linux defaults, shown at setup.sh prompts (Enter keeps them).
# Never put tokens or secrets here.

# rclone remote name
REMOTE_NAME='onedrive'

# systemd user service name (without .service)
SERVICE_NAME='rclone-onedrive'

# Where OneDrive appears; must be empty or not exist yet
MOUNT_DIR='~/OneDrive'

# Local cache for opened and pending files
CACHE_DIR='~/.cache/rclone-onedrive'

# yes = create a service that mounts OneDrive at login
# no  = no service; mount manually with rclone mount
AUTOSTART='yes'

# Empty = the signed-in user's own OneDrive (auto-detected)
# Set a drive ID to force a specific drive, e.g. a SharePoint library
DRIVE_ID=''

# Cache mode:
#   off     = no caching; some apps can't save files
#   minimal = caches only files opened for read+write
#   writes  = caches files being written; reads stream from OneDrive
#   full    = caches everything; best app compatibility (recommended)
VFS_CACHE_MODE='full'

# Maximum cache size on disk (e.g. 5G, 20G)
VFS_CACHE_MAX_SIZE='10G'

# How long unused files stay in the cache (e.g. 1h, 24h, 7d)
VFS_CACHE_MAX_AGE='24h'

# How long folder listings are cached before checking OneDrive again
DIR_CACHE_TIME='5m'

# Extra rclone mount arguments, e.g. '--allow-other --read-only'
EXTRA_MOUNT_ARGS=''

# How to install rclone if missing:
#   auto    = try the distro package, fall back to the rclone.org script
#   package = distro package only (apt, dnf, ...); may be an older version
#   script  = official rclone.org install script; always the latest version
RCLONE_INSTALL_METHOD='auto'
